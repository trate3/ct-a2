[project]
name = "certified_taps_artifact"
version = "1.0.0"
description = "Reproduction artifact for the Certified Taps paper: certification protocol, live tap cost (EQ1) and coding monitors (EQ2)."
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",   # Ed25519 attestation signatures + sealed-box confidential transport
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml"]
gcp = ["pyjwt[crypto]>=2.8"]          # Confidential Space token verification
# GPU re-runs (EQ1 live generation, activation extraction, rollouts and monitors)
model = ["torch", "transformers>=5.15", "accelerate", "flash-linear-attention", "causal-conv1d"]
rh = ["datasets", "jinja2", "jsonschema", "requests"]

[tool.pytest.ini_options]
testpaths = ["ct_core", "util", "evals", "evals_runner", "tee", "figure4_prototype/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["ct_core*", "util*", "evals*", "evals_runner*", "tee*", "figure4_prototype*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
